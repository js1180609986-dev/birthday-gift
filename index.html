<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday!</title>
  
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 25px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      max-width: 450px;
      width: 100%;
      transform: translateY(0);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .emoji {
      font-size: 4rem;
      margin-bottom: 15px;
      display: inline-block;
      animation: bounce 2s infinite;
    }

    h1 {
      color: #ff4757;
      font-size: 2.2rem;
      margin-bottom: 15px;
    }

    p {
      color: #57606f;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn {
      background: #ff4757;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
      transition: all 0.2s ease;
      width: 100%;
      max-width: 250px;
    }

    .btn:active {
      transform: scale(0.96);
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    /* Mobile fine-tuning */
    @media (max-width: 480px) {
      .card {
        padding: 30px 20px;
      }
      h1 {
        font-size: 1.8rem;
      }
      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="emoji">🎂</div>
    <h1>Happy Birthday!</h1>
    <p>Wishing you a fantastic day filled with laughter, joy, and lots of cake! May all your dreams come true this year.</p>
    <button class="btn" onclick="fireConfetti()">Celebrate! 🎉</button>
  </div>

  <script>
    // Trigger confetti on page load
    window.addEventListener('DOMContentLoaded', () => {
      fireConfetti();
    });

    // Custom confetti blast function
    function fireConfetti() {
      // Left side burst
      confetti({
        particleCount: 60,
        angle: 60,
        spread: 55,
        origin: { x: 0, y: 0.7 }
      });

      // Right side burst
      confetti({
        particleCount: 60,
        angle: 120,
        spread: 55,
        origin: { x: 1, y: 0.7 }
      });
    }
  </script>

</body>
</html>
